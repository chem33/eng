<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 테스트</title>
<style>
body{margin:0;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#f0f9ff;color:#1e293b;}
main{max-width:640px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;}
h1{margin:0;font-size:28px;}
label{font-size:16px;color:#475569;}
input,select{font:inherit;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid #cbd5e1;width:100%;box-sizing:border-box;background:#fff;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
button{font:inherit;font-size:20px;border:0;border-radius:14px;padding:14px 18px;color:#fff;background:#3b82f6;cursor:pointer;flex:1;}
button.mp3{background:#22c55e;}
button.chip{flex:none;font-size:17px;padding:8px 12px;background:#e2e8f0;color:#1e293b;}
button:disabled{background:#cbd5e1;}
#info{font-size:15px;color:#475569;white-space:pre-line;}
</style>
</head>
<body>
<main>
  <h1>🔊 음성 테스트</h1>

  <label for="text">단어나 짧은 문장을 써 보세요</label>
  <input id="text" value="apple" autocomplete="off">
  <div class="row" id="samples"></div>

  <label for="voice">기기 목소리 (영어)</label>
  <select id="voice"></select>

  <label for="rate">속도: <span id="rateTxt">0.85</span></label>
  <input id="rate" type="range" min="0.5" max="1.2" step="0.05" value="0.85" style="padding:0">

  <div class="row">
    <button id="device">📱 기기 음성으로 읽기</button>
    <button id="mp3" class="mp3">🎧 녹음 음성(MP3)</button>
  </div>
  <div id="info"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const SAMPLES = ['apple', 'ear', 'egg', 'strawberry', 'I like apples.', 'This is my dog.', 'Can you see the red ball?'];
SAMPLES.forEach(s => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = s;
  b.onclick = () => { $('text').value = s; checkMp3(); };
  $('samples').appendChild(b);
});

let voices = [];
function loadVoices(){
  if (!('speechSynthesis' in window)){ $('info').textContent = '이 브라우저는 기기 음성을 지원하지 않아요.'; return; }
  voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const sel = $('voice'), prev = sel.value;
  sel.innerHTML = '<option value="">(기기 기본 목소리)</option>' +
    voices.map((v, i) => `<option value="${i}">${v.name} · ${v.lang}${v.localService ? '' : ' · 온라인'}</option>`).join('');
  if (prev) sel.value = prev;
  $('info').textContent = `이 기기의 영어 목소리: ${voices.length}개`;
}
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;

$('rate').oninput = () => $('rateTxt').textContent = $('rate').value;

$('device').onclick = () => {
  const text = $('text').value.trim(); if (!text) return;
  player.pause();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  const v = voices[$('voice').value]; if (v){ u.voice = v; u.lang = v.lang; }
  u.rate = +$('rate').value;
  speechSynthesis.speak(u);
};

// 녹음 음성은 게임에 들어 있는 단어만 있어요
const player = new Audio();
const clipName = t => t.toLowerCase().replace(/[^a-z]+/g, '_').replace(/^_|_$/g, '');
function checkMp3(){
  const url = 'audio/' + clipName($('text').value) + '.mp3';
  fetch(url, {method:'HEAD'}).then(r => setMp3(r.ok), () => setMp3(false));
}
function setMp3(ok){
  $('mp3').disabled = !ok;
  $('mp3').textContent = ok ? '🎧 녹음 음성(MP3)' : '🎧 녹음 파일 없음';
}
$('text').addEventListener('input', checkMp3);
$('mp3').onclick = () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  player.src = 'audio/' + clipName($('text').value) + '.mp3';
  player.playbackRate = +$('rate').value / 0.85;
  player.play();
};
checkMp3();
</script>
</body>
</html>

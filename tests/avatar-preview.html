<!doctype html>
<meta charset="utf-8"><title>avatar preview</title>
<style>body{font-family:sans-serif;background:#fff8e7;margin:12px}.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:8px 0}.cell{text-align:center;font-size:12px}button{font-size:16px;padding:6px 12px}</style>
<h3>몸 6종 × 크기 3종</h3><div id="grid"></div>
<h3>슬롯별 아이템 착용 (펫 포함)</h3><div class="row" id="sets"></div>
<h3>반응</h3><div class="row"><div id="rx"></div>
<button onclick="Avatar.react(rx,'cheer')">cheer</button><button onclick="Avatar.react(rx,'hurt')">hurt</button><button onclick="Avatar.react(rx,'attack')">attack</button></div>
<script>
// 가짜 전역 (items.js / avatar.js 가 읽어요)
var S = {avatar:{body:'kid1',equip:{}}, owned:[], coins:0, petOn:10, shop:{}, trophies:{}, words:{}};
function save(){} function today(){return '2026-01-01'} function level(){return 99}
</script>
<script src="../items.js"></script><script src="../avatar.js"></script>
<script>
S.owned = ITEMS.map(i => i.id);
const grid = document.getElementById('grid');
BODIES.forEach(b => {
  const row = document.createElement('div'); row.className = 'row'; grid.appendChild(row);
  ['s','m','l'].forEach(sz => { const c = document.createElement('div'); c.className = 'cell'; row.appendChild(c); Avatar.render(c, {size:sz, body:b.id}); });
});
const sets = document.getElementById('sets');
[{hat:'crown',face:'glasses',hand:'wand',back:'cape',effect:'sparkle'},
 {hat:'tophat',face:'sunglasses',hand:'shield',back:'wings',effect:'fire'},
 {hat:'ribbon',face:'mask',hand:'balloon',back:'backpack',effect:'rainbow'}].forEach((pv, i) => {
  const c = document.createElement('div'); c.className = 'cell'; sets.appendChild(c);
  Avatar.render(c, {size:'l', pet:true, preview:pv, body:BODIES[i*2].id});
});
S.avatar.equip.effect = 'heart';
const rx = document.getElementById('rx'); Avatar.render(rx, {size:'l', pet:true, preview:{hat:'crown',hand:'wand'}});
</script>

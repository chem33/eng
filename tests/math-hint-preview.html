<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>math hint preview</title>
<style>
body{font-family:system-ui,"Malgun Gothic",sans-serif;background:#eef6fb;margin:0;padding:12px;color:#1d2b3a;}
h3{margin:6px 0;font-size:16px;}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.bar button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;background:#dbe7f1;cursor:pointer;font-size:14px;}
.bar button.on{background:#ff8a3d;color:#fff;}
#log{font-size:13px;color:#567;margin:6px 0;min-height:18px;}
</style>
</head><body>
<h3>수학 힌트 미리보기 — 예시를 누르면 MathHint.run, "ask" 는 고르기 화면</h3>
<div class="bar" id="ex"></div>
<div class="bar" id="ex2"></div>
<div id="log"></div>
<div id="mgame"></div>
<script>
// 게임(index.html)이 주는 전역을 흉내 내요
const $ = id => document.getElementById(id);
let actx = null;
function tone(freq, dur, type, when, vol){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + (when || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
  } catch(e) {}
}
const sfxGood = () => { tone(660,.15,'triangle',0); tone(880,.15,'triangle',.1); tone(1320,.25,'triangle',.2); };
const sfxBad  = () => { tone(200,.25,'sawtooth',0,.08); tone(150,.3,'sawtooth',.12,.08); };
const sfxWin  = () => [523,659,784,1047].forEach((f,i) => tone(f,.3,'triangle',i*.15));
function toast(msg){ $('log').textContent = '[toast] ' + msg; }
function floatText(){}
</script>
<script src="../math-core.js"></script>
<script src="../math-hint.js"></script>
<script>
const M = MathCore;
const num = s => { const m = s.match(/^(?:(\d+) )?(\d+)\/(\d+)$/); return m ? M.frac(+(m[1] || 0), +m[2], +m[3]) : M.dec(+s); };
function prob(s){
  const [, x, op, y] = s.match(/^(.+?)([+-])(.+)$/);
  let a = num(x), b = num(y);
  if (a.t === 'd' && b.t === 'f') a = M.frac(a.h / 100, 0, b.d);   // 1 − 3/8 의 1 은 8칸짜리 1
  if (b.t === 'd' && a.t === 'f') b = M.frac(b.h / 100, 0, a.d);
  return {a, b, op, ans: op === '+' ? M.add(a, b) : M.sub(a, b)};
}
// 스펙 예시 11개 + 1.25−0.4, 그리고 추가 확인용
const EX = ['0.35+0.8', '2.7+1.4', '0.35+0.48', '3/5+4/5', '0.3+0.4', '0.7-0.3', '0.53-0.28', '1.2-0.35', '1 2/5-4/5', '3-1.25', '1-3/8', '1.25-0.4'];
const EX2 = ['3 1/5-1 3/5', '1 2/7+2 6/7', '1.9-0.35', '2 3/5-1 1/5', '0.23+0.45', '7/12+8/12', '1 1/5+2 2/5'];
let cur = EX[1];
const log = t => { $('log').textContent = t; };
function start(s){
  cur = s;
  document.querySelectorAll('.bar button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  const p = prob(s), wrong = M.distractors(p, 1)[0];
  log(`${s} = ${M.text(p.ans)} · kind ${M.hintPlan(p).kind} · 고른 오답 ${M.text(wrong)}`);
  MathHint.run($('mgame'), p, wrong, () => log(`onDone() 호출됨 (${s})`));
}
function ask(){
  const p = prob(cur), wrong = M.distractors(p, 1)[0];
  log(`ask: ${cur}`);
  MathHint.ask($('mgame'), {wrong, onHint: () => start(cur), onRetry: () => log('onRetry() 호출됨')});
}
const mk = (box, list) => list.forEach(s => {
  const b = document.createElement('button'); b.textContent = s.replace('-', ' − ').replace('+', ' + '); b.dataset.s = s;
  b.onclick = () => start(s); $(box).appendChild(b);
});
mk('ex', EX); mk('ex2', EX2);
const a = document.createElement('button'); a.textContent = '❓ ask (고르기 화면)'; a.onclick = ask; $('ex2').appendChild(a);
start(cur);
</script>
</body></html>
